name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      - run: dotnet test -c Release --no-build

      - if: matrix.os == 'ubuntu-latest'
        run: dotnet publish src/Ssp.Web -c Release -o publish

      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/wwwroot

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: scripts/playwright.sh
        env:
          SSP_PLAYWRIGHT_WITH_DEPS: "1"

  kicad:
    name: kicad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad

      - name: Export the golden schematic as a netlist
        run: |
          cp tests/Ssp.Core.Tests/Golden/kicad-divider.txt divider.kicad_sch
          kicad-cli sch export netlist --output divider.net divider.kicad_sch
          cat divider.net
